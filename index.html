<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1e293b 0%, #0b1020 58%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border: 1px solid #334155;
      border-radius: 28px;
      background: rgb(15 23 42 / 94%);
      box-shadow: 0 24px 70px rgb(0 0 0 / 38%);
    }

    h1 {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .display {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 12px 4px 22px;
      text-align: right;
    }

    .previous {
      min-height: 24px;
      color: #94a3b8;
      font-size: 1rem;
    }

    .current {
      width: 100%;
      overflow: hidden;
      font-size: clamp(2.5rem, 13vw, 3.5rem);
      font-weight: 350;
      letter-spacing: -0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.18;
      border: 0;
      border-radius: 18px;
      background: #263247;
      color: #f8fafc;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #35445c; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
    button.utility { background: #3a465c; color: #cbd5e1; }
    button.operator { background: #164e63; color: #a5f3fc; }
    button.operator:hover { background: #0e7490; }
    button.equals { background: #06b6d4; color: #082f49; font-weight: 700; }
    button.equals:hover { background: #22d3ee; }
    button.zero { grid-column: span 2; aspect-ratio: auto; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>

  <script>
    const currentDisplay = document.querySelector("#current");
    const previousDisplay = document.querySelector("#previous");
    let currentValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let replaceCurrent = false;

    function render() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = storedValue === null
        ? ""
        : `${storedValue} ${pendingOperator ?? ""}`;
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) {
        currentValue = "Error";
        storedValue = null;
        pendingOperator = null;
        replaceCurrent = true;
        return;
      }
      currentValue = String(Number(value.toPrecision(12)));
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "−": return left - right;
        case "×": return left * right;
        case "÷": return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function enterDigit(digit) {
      if (currentValue === "Error" || replaceCurrent) {
        currentValue = digit;
        replaceCurrent = false;
      } else if (currentValue === "0") {
        currentValue = digit;
      } else if (currentValue.replace("-", "").length < 15) {
        currentValue += digit;
      }
      render();
    }

    function chooseOperator(operator) {
      if (currentValue === "Error") return;
      const input = Number(currentValue);
      if (pendingOperator && !replaceCurrent) {
        formatResult(calculate(storedValue, input, pendingOperator));
      } else {
        storedValue = input;
      }
      pendingOperator = operator;
      replaceCurrent = true;
      render();
    }

    function runAction(action) {
      if (action === "clear") {
        currentValue = "0";
        storedValue = null;
        pendingOperator = null;
        replaceCurrent = false;
      } else if (action === "decimal") {
        if (currentValue === "Error" || replaceCurrent) {
          currentValue = "0.";
          replaceCurrent = false;
        } else if (!currentValue.includes(".")) {
          currentValue += ".";
        }
      } else if (action === "sign" && currentValue !== "Error") {
        currentValue = String(-Number(currentValue));
      } else if (action === "percent" && currentValue !== "Error") {
        currentValue = String(Number(currentValue) / 100);
      } else if (action === "backspace") {
        if (currentValue === "Error" || replaceCurrent || currentValue.length === 1 ||
            (currentValue.length === 2 && currentValue.startsWith("-"))) {
          currentValue = "0";
          replaceCurrent = false;
        } else {
          currentValue = currentValue.slice(0, -1);
        }
      } else if (action === "equals" && pendingOperator && storedValue !== null) {
        const result = calculate(storedValue, Number(currentValue), pendingOperator);
        previousDisplay.textContent = `${storedValue} ${pendingOperator} ${currentValue} =`;
        formatResult(result);
        storedValue = null;
        pendingOperator = null;
        replaceCurrent = true;
        currentDisplay.textContent = currentValue;
        return;
      }
      render();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else runAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") runAction("decimal");
      else if (event.key === "Backspace") runAction("backspace");
      else if (event.key === "Escape") runAction("clear");
      else if (event.key === "Enter" || event.key === "=") runAction("equals");
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*") chooseOperator("×");
      else if (event.key === "/") {
        event.preventDefault();
        chooseOperator("÷");
      }
    });
  </script>
</body>
</html>
